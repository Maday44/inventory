{% extends "base.html" %}
{% block title %}Delete Account{% endblock %}

{% block content %}
{% include "storage/navbar.html" %}

<div class="container py-5">
  <h2 class="text-danger">Delete Account</h2>

  <p class="text-muted">
    This action is permanent. All your data will be removed.
  </p>
  <p class="text-muted">
    You will have 7 days to recover your account
  </p>



  <form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete my account</button>
    <a href="{% url 'settings' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
