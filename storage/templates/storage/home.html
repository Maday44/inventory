{% extends "base.html" %}
{% block title %}Family Dashboard{% endblock %}

{% block content %}
{% include "storage/navbar.html" %}
<div class="container py-4">
  <div id="root"></div>
</div>

<script>
  const allFoodUrl = "{% url 'all_food' %}";
  const allOtherUrl = "{% url 'all_other_items' %}";
  const foodItemsApiUrl = "{% url 'food-items-list' %}";
  const otherItemsApiUrl = "{% url 'other-items-list' %}";
</script>


{% verbatim %}
<script type="text/babel">
  const MAX_ITEMS = 6;

  // Food Items Component
  const FoodItemsPad = () => {
    const [foodItems, setFoodItems] = React.useState([]);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
      axios.get(foodItemsApiUrl)
        .then((response) => {
          setFoodItems(response.data.results || response.data || []);
          setLoading(false);
        })
        .catch((error) => {
          console.error("Failed to fetch food items:", error);
          setLoading(false);
        });
    }, []);

    if (loading) return <p className="text-center mt-5">Loading...</p>;

    return (
      <div className="container py-5">
        
        <h2 className="text-center mb-5 fw-bold">
          <a href={allFoodUrl} className="nav-link px-3 text-dark">Food Items</a>
        </h2>


        

        <div
          className="food-grid"
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))",
            gap: "20px"
          }}
        >
          {foodItems.slice(0, MAX_ITEMS).map((item) => (
            <a
              key={item.slug}
              href={`/food/${item.slug}/`}
              className="text-decoration-none text-dark"
            >
              <div
                className="card h-100 border-0 shadow-sm rounded-4"
                style={{
                  aspectRatio: "1/1",
                  display: "flex",
                  flexDirection: "column",
                  transition: "transform 0.2s ease, box-shadow 0.2s ease"
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.transform = "translateY(-6px)";
                  e.currentTarget.style.boxShadow = "0 6px 20px rgba(0,0,0,0.15)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.transform = "translateY(0)";
                  e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)";
                }}
              >
                <img
                  src={item.image}
                  alt={item.title}
                  style={{
                    height: "50%",
                    width: "100%",
                    objectFit: "cover",
                    borderTopLeftRadius: "1rem",
                    borderTopRightRadius: "1rem"
                  }}
                />
                <div
                  className="card-body d-flex flex-column justify-content-between"
                  style={{ flex: 1 }}
                >
                  <div>
                    <h5 className="card-title fw-semibold mb-2">{item.title}</h5>
                    <p className="card-text text-muted mb-1">
                      <strong>Brand:</strong> {item.brand || "N/A"}
                    </p>
                    <p className="card-text text-muted mb-1">
                      <strong>Quantity:</strong> {item.quantity}
                    </p>
                    <p className="card-text text-muted mb-0">
                      <strong>Expires:</strong> {item.exp_date || "Unknown"}
                    </p>
                  </div>
                </div>
              </div>
            </a>
          ))}
        </div>
      </div>
    );
  };

  // Other Items Component
  const OtherItemsPad = () => {
    const [otherItems, setOtherItems] = React.useState([]);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
      axios.get(otherItemsApiUrl)
        .then((response) => {
          setOtherItems(response.data.results || response.data || []);
          setLoading(false);
        })
        .catch((error) => {
          console.error("Failed to fetch other items:", error);
          setLoading(false);
        });
    }, []);

    if (loading) return <p className="text-center mt-5">Loading...</p>;

    return (
      <div className="container py-5">
        <h2 className="text-center mb-5 fw-bold">
          <a href={allOtherUrl} className="nav-link px-3 text-dark"> Other Items</a>
        </h2>
        <div
          className="food-grid"
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))",
            gap: "20px"
          }}
        >
          {otherItems.slice(0, MAX_ITEMS).map((item) => (
            <a
              key={item.slug}
              href={`/other/${item.slug}/`}
              className="text-decoration-none text-dark"
            >
              <div
                className="card h-100 border-0 shadow-sm rounded-4"
                style={{
                  aspectRatio: "1/1",
                  display: "flex",
                  flexDirection: "column",
                  transition: "transform 0.2s ease, box-shadow 0.2s ease"
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.transform = "translateY(-6px)";
                  e.currentTarget.style.boxShadow = "0 6px 20px rgba(0,0,0,0.15)";
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.transform = "translateY(0)";
                  e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)";
                }}
              >
                <img
                  src={item.image}
                  alt={item.title}
                  style={{
                    height: "50%",
                    width: "100%",
                    objectFit: "cover",
                    borderTopLeftRadius: "1rem",
                    borderTopRightRadius: "1rem"
                  }}
                />
                <div
                  className="card-body d-flex flex-column justify-content-between"
                  style={{ flex: 1 }}
                >
                  <div>
                    <h5 className="card-title fw-semibold mb-2">{item.title}</h5>
                    <p className="card-text text-muted mb-1">
                      <strong>Brand:</strong> {item.brand || "N/A"}
                    </p>
                    <p className="card-text text-muted mb-1">
                      <strong>Quantity:</strong> {item.quantity}
                    </p>
                  </div>
                </div>
              </div>
            </a>
          ))}
        </div>
      </div>
    );
  };

  // Home Page
  const HomePage = () => (
    <div>
      <h1 className="my-4 text-center">Welcome to Family Dashboard</h1>
      <FoodItemsPad />
      <OtherItemsPad />
    </div>
  );

  ReactDOM.createRoot(document.getElementById("root")).render(<HomePage />);
</script>
{% endverbatim %}
{% endblock %}
