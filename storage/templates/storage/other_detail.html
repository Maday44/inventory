{% extends "base.html" %}
{% load i18n %}

{% block content %}
{% include "storage/navbar.html" %}
<main class="container my-4 position-relative">


    <!-- Edit (pen) icon button -->
    <div class="d-flex justify-content-end mb-3">
      <a href="" 
         class="btn btn-outline-secondary btn-sm" 
         title="Edit Item">
        <i class="bi bi-pencil-square"></i>
      </a>
    </div>


  {% if request.GET.success %}
    <div class="alert alert-success mt-4">
      Item was updated successfully!
    </div>
  {% endif %}

  <div class="row">
    <div class="col-12">
      <div class="card mb-4 shadow-sm">
        <div class="row g-0">
          <div class="col-md-4">
            <img src="{{ other.image.url }}" 
                 class="img-fluid rounded-start" 
                 alt="{{ other.title }}"
                 style="width: 100%; height: 350px; object-fit: cover;">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">{{ other.brand }}</h5>
              <h5 class="card-title">{{ other.title }}</h5>
              <p class="card-text">
                Quantity: {{ other.quantity }}<br>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
