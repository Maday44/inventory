{% extends "base.html" %}
{% block content %}
{% include "storage/navbar.html" %}

<div class="container mt-5">
    <h2>Send Shopping List: {{ shopping_list.title }} 🛒</h2>

    <p>Recipients: {{ recipient_emails }}</p>

    <h4>Shopping List Details:</h4>
    <pre>{{ message_body }}</pre>

    <form method="post" action="{% url 'send_shopping_email' shopping_list.slug %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Send Email to All Family Members</button>
    </form>

    {% if result %}
        <p class="mt-3">{{ result }}</p>
    {% endif %}
</div>
{% endblock %}
