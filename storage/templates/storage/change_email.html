{% extends "base.html" %}
{% block title %}Change Email{% endblock %}

{% block content %}
{% include "storage/navbar.html" %}

<div class="container py-5" style="max-width: 500px;">
  <h2 class="mb-4">Change Email</h2>

  <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label fw-bold">New Email</label>
      {{ form.new_email }}
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Current Password</label>
      {{ form.password }}
    </div>

    <button class="btn btn-primary">Update Email</button>
    <a href="{% url 'settings' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
