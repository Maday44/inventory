<div class="food-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
  {% for item in others %}
    <a href="{% url 'other_detail' item.slug %}" class="text-decoration-none text-dark">
      <div class="card h-100 border-0 shadow-sm rounded-4"
           style="aspect-ratio: 1/1; display:flex; flex-direction: column;">
        <img src="{{ item.image.url }}" alt="{{ item.title }}"
             style="height:50%; width:100%; object-fit: cover; border-top-left-radius: 1rem; border-top-right-radius: 1rem;" />
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title fw-semibold mb-2">{{ item.title }}</h5>
            <p class="card-text text-muted mb-1"><strong>Brand:</strong> {{ item.brand|default:"N/A" }}</p>
            <p class="card-text text-muted mb-1"><strong>Quantity:</strong> {{ item.quantity }}</p>
          </div>
        </div>
      </div>
    </a>
  {% empty %}
    <p class="text-center mt-5">No other items found.</p>
  {% endfor %}
</div>
