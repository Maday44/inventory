{% extends 'base.html' %}
{% block content %}
{% include "storage/navbar.html" %}

<div class="container mt-5">
    <h2 class="mb-4">🛒 Add New Shopping List</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'all_shop_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
