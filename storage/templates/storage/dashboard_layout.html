{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ family_name }} Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body
  data-theme="{{ request.user.profile.theme|default:'light' }}"
  style="
    font-size: {{ request.user.profile.font_size|default:16 }}px;
    letter-spacing: {{ request.user.profile.letter_spacing|default:0 }}px;
  "
>

<section class="container py-4 dashboard">

  <header class="dashboard-header text-center mb-5">
    <h1>{{ family_name }}'s Dashboard</h1>
  </header>

  <div class="dashboard-grid">

    <div class="dashboard-widget">
      <h5 class="widget-title">Date & Time</h5>
      <p id="current-date"></p>
      <p id="current-time"></p>
      <p id="current-season"></p>
    </div>

    <div class="dashboard-widget">
      <h5 class="widget-title">Weather</h5>
      <p id="weather-location">Loading...</p>
      <p id="weather-temp"></p>
      <p id="weather-desc"></p>
    </div>

  </div>

</section>


<script>

  function getSeason(month) {
    if (month <= 1 || month === 11) return "Winter ❄️";
    if (month <= 4) return "Spring 🌱";
    if (month <= 7) return "Summer ☀️";
    return "Autumn 🍂";
  }

  function updateDateTime() {
    const now = new Date();

    document.getElementById("current-date").textContent =
      now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

    document.getElementById("current-time").textContent =
      now.toLocaleTimeString();

    document.getElementById("current-season").textContent =
      "Season: " + getSeason(now.getMonth());
  }

  updateDateTime();
  setInterval(updateDateTime, 1000);



  const WEATHER_API_KEY = "{{ weather_api_key }}";
  function loadWeather(lat, lon) {
    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${WEATHER_API_KEY}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("weather-location").textContent =
          `${data.name}, ${data.sys.country}`;

        document.getElementById("weather-temp").textContent =
          `🌡️ ${Math.round(data.main.temp)}°C`;

        document.getElementById("weather-desc").textContent =
          `☁️ ${data.weather[0].description}`;
      })
      .catch(() => {
        document.getElementById("weather-widget").innerHTML =
          "<p>Unable to load weather data</p>";
      });
  }

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => document.getElementById("weather-location").textContent = "Location access denied"
    );
  } else {
    document.getElementById("weather-location").textContent = "Geolocation not supported";
  }
</script>

</body>
</html>
