
{% extends "base.html" %}


{% block content %}

<h1>Login</h1>
{% if form.non_field_errors %}
    <div class="alert alert-danger mt-3">
        {% for error in form.non_field_errors %}
            {{ error }}
        {% endfor %}
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>


{% endblock %}
