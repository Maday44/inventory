<!DOCTYPE html>
<!-- nned to fix and place in sepate files html,css,js -->
 <!-- https://codepen.io/joshuaseigler/pen/gPxoZZ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>403 Forbidden</title>

  <style>
    /* ===== PAGE WRAPPER ===== */
    #error-403 {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;

      --mouseX: -64;
      --mouseY: -64;
      --width: 0;
      --height: 0;
    }

    .error-title {
      font-size: 15vmin;
      margin-bottom: 0;
      color: #06402B;
    }

    .error-code {
      font-size: 5vmin;
      margin-top: 0;
      margin-bottom: 40px;
      color: green;
    }

    /* ===== JAIL ===== */
    .mouse-jail {
      position: relative;
      border: 2px solid gray;
      border-radius: 50%;
      width: 32px;
      height: 32px;
    }

    .jail-spinner {
      display: none;
      position: absolute;
      width: 100px;
      height: 100px;
      left: 50%;
      top: 50%;
      transform-origin: 50% 50%;
      animation: spin 4s linear infinite;
    }

    #error-403.seenMouse .jail-spinner {
      display: block;
    }

    #error-403.seenMouse .fake-cursor {
      position: absolute;
      left: 12px;
      top: 8px;
      animation: dragMouse 2s ease forwards;
      width: 32px;
      height: 32px;
      background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABmJLR0QAAAAAAAD5Q7t/AAABX0lEQVRYw+3UMUvDUBQF4EOv3Nk2OnjxB4gg6OQo2Nm/5c9w0snJyUWlKAhBEaRgKypiiK/FrdBCad/NdWkgFnHyNUvOEshyPk5eHoilRyy7KCm12fOwNASx9D5d34jlshQEsfTMzEpD5IDSEEVAKYh5wMIRvwFU1ZIkXQxiHqCqNp1ObTwe2+vbe3hEEVAsH41GNhgM7OmpGxSRX0TIsgxZlkFVoarw3kNVsbLSwH18vo9Al1Xtr3LvPbz3iKI6bm/O9gEc/jdgKQfk5WnqsLoawXuPtfXtqxCz/wix9PJv/vz8YsQyPD45NeecEcsFsRwEBxTLiWWXWNpJklgc3xmxtEP21wAgTR02t/ZGAJo6cTGAj4eHNhqNZQD4CLrC7BcbFk/4bIVOt9u1VuvaiOUxVP+STlxz/qVOXEwsb/3+10YU1QFgGmyBP5YRYukQyxGx7CwcUKVKlSpVqiwq37opL7UKP+WdAAAAAElFTkSuQmCC);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(360deg); }
      100% { transform: translate(-50%, -50%) rotate(0deg); }
    }

    @keyframes dragMouse {
      0% {
        left: calc(var(--mouseX) * 1px);
        top: calc(var(--mouseY) * 1px);
      }
      100% {
        left: calc(var(--mouseX) / var(--width) * 10px + 12px);
        top: calc(var(--mouseY) / var(--height) * 10px + 8px);
      }
    }
  </style>
</head>
<body>

  <div id="error-403">
    <h1 class="error-title">Forbidden!</h1>
    <h2 class="error-code">Code 403</h2>

    <div id="jail" class="mouse-jail">
      <svg class="jail-spinner" viewBox="0 0 1000 1000">
        <defs>
          <path id="textPath" d="M 250 500 A 250,250 0 1 1 250 500.0001"/>
        </defs>
        <text style="font-size:90pt;">
          <textPath href="#textPath" startOffset="0%">MOUSE JAIL</textPath>
          <textPath href="#textPath" startOffset="50%">MOUSE JAIL</textPath>
        </text>
      </svg>

      <div class="fake-cursor"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('error-403');
    const jail = document.getElementById('jail');
    let seenMouse = false;

    document.addEventListener('mousemove', updateMouse);
    document.addEventListener('mouseenter', updateMouse);
    document.addEventListener('mouseleave', resetMouse);

    function updateMouse(e) {
      const jailRect = jail.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      container.style.setProperty('--mouseX', e.pageX - jailRect.left);
      container.style.setProperty('--mouseY', e.pageY - jailRect.top);
      container.style.setProperty('--width', containerRect.width);
      container.style.setProperty('--height', containerRect.height);

      if (!seenMouse) {
        container.classList.add('seenMouse');
        seenMouse = true;
      }
    }

    function resetMouse() {
      container.classList.remove('seenMouse');
      seenMouse = false;
    }
  </script>

</body>
</html>
